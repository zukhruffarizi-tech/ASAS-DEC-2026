<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Checklist Pengumpulan Soal ASAS DEC-26</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            min-height: 100vh;
            height: auto;
            overflow-y: auto; 
            /* Latar belakang deep dark blue ala iOS Control Center */
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 60%, #020617 100%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .iframe-container {
            width: 100%;
            min-height: 100vh;
            height: auto;
            border: none;
            position: relative;
        }
        iframe {
            width: 100%;
            min-height: 100vh;
            height: 100%;
            border: none;
            display: block;
        }
        .page-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
            font-size: 14px;
            font-style: italic;
            z-index: -1;
        }
    </style>
</head>
<body>

<div class="iframe-container">
    <div class="page-loader">Menghubungkan ke server...</div>
    <iframe src="https://script.google.com/macros/s/AKfycbyS4zVazu7yOwJnjuy4ym8BJFkg24OEwxtB7Avx6Pfp6nzZqEEzqtxHQ5Mhy4r02m5Y/exec" 
            allow="fullscreen">
    </iframe>
</div>

</body>
</html>
