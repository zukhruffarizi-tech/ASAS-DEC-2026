<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Informasi Asesmen Sumatif Akhir Desember 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #EEF5FC;
            margin: 0;
            padding: 15px 12px 60px 12px;
            color: #0f172a;
            min-height: 100vh;
            position: relative;
            overflow-x: clip;
            overflow-y: visible;
        }

        .container {
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Kaca bening: hanya latar di belakang kartu yang diburamkan. */
        .announcement-card,
        .card {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.20),
                rgba(255, 255, 255, 0.12)
            );

            /* Garis tipis transparan untuk tepi kaca yang lebih lembut. */
            border: 1px solid rgba(82, 107, 85, 0.18);
            border-top-color: rgba(255, 255, 255, 0.85);

            -webkit-backdrop-filter: blur(5px) saturate(140%);
            backdrop-filter: blur(5px) saturate(140%);

            box-shadow:
                0 2px 6px rgba(15, 23, 42, 0.025),
                0 12px 32px rgba(15, 23, 42, 0.045),
                inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        /* Tampilan cadangan jika browser belum mendukung backdrop-filter. */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .announcement-card,
            .card {
                background: rgba(255, 255, 255, 0.88);
            }
        }

        /* Surat tetap dalam alur halaman, tidak menempel saat scroll. */
        .announcement-card {
            position: static;
            border-radius: 18px;
            padding: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .announcement-card img {
            width: 100%;
            height: auto;
            max-height: calc(100vh - 56px);
            max-height: calc(100svh - 56px);
            object-fit: contain;
            border-radius: 12px;
            display: block;
        }

        /* Transparan agar daun tidak tertutup panel. */
        .checklist-panel {
            position: relative;
            background: transparent;
            border-radius: 22px 22px 0 0;
            padding: 16px 0 0;
        }

        .header-section {
            text-align: left;
            margin: 10px 0 20px 0;
            padding-left: 4px;
        }

        h2 {
            color: #0f172a;
            margin: 0 0 4px 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .update-info {
            font-size: 11px;
            color: #475569;
            font-weight: 600;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .author-tag {
            color: #64748b;
            font-weight: 500;
        }

        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .card {
            border-radius: 18px;
            padding: 14px;
            width: 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(82, 107, 85, 0.09);
            padding-bottom: 8px;
            margin-bottom: 10px;
            gap: 10px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
        }

        .sections-wrapper {
            display: flex;
            flex-direction: row;
            gap: 8px;
        }

        .section-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .section-title {
            font-size: 9.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title-dien {
            color: #0f766e;
        }

        .title-umum {
            color: #0284c7;
        }

        .card-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;

            /* Tetap transparan agar efek kaca terlihat. */
            background: rgba(248, 250, 252, 0.28);

            border-radius: 10px;
            border: 1px solid rgba(82, 107, 85, 0.12);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
            gap: 4px;
        }

        .label {
            font-weight: 700;
            color: #1e293b;
            font-size: 10px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-pill {
            padding: 3px 6px;
            border-radius: 12px;
            font-size: 8.5px;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
        }

        .status-hijau {
            background-color: rgba(209, 250, 229, 0.85);
            color: #065f46;
            border: 1px solid rgba(52, 211, 153, 0.22);
        }

        .status-merah {
            background-color: rgba(254, 226, 226, 0.85);
            color: #991b1b;
            border: 1px solid rgba(248, 113, 113, 0.20);
        }

        .status-abu {
            background-color: rgba(241, 245, 249, 0.85);
            color: #475569;
            border: 1px solid rgba(203, 213, 225, 0.35);
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-style: italic;
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
        }

        /*
         * Daun berada di belakang konten.
         * Di luar kartu terlihat tajam.
         * Di belakang kartu diburamkan oleh backdrop-filter.
         */
        .maple-fall {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .maple-definitions {
            position: absolute;
            width: 0;
            height: 0;
        }

        .maple-leaf {
            position: absolute;
            top: 0;
            left: var(--x);
            width: var(--size);
            height: var(--size);
            color: var(--leaf-color);
            opacity: 0;
            animation: maple-fall var(--duration) var(--delay) linear infinite;
        }

        .maple-leaf svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        @keyframes maple-fall {
            0% {
                transform: translate3d(0, -48px, 0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.5;
            }

            50% {
                transform: translate3d(var(--sway), 50vh, 0) rotate(155deg);
            }

            90% {
                opacity: 0.5;
            }

            100% {
                transform: translate3d(
                    var(--drift),
                    calc(100vh + 48px),
                    0
                ) rotate(310deg);
                opacity: 0;
            }
        }

        /* Pada ponsel cukup tiga helai daun. */
        @media (max-width: 600px) {
            .maple-leaf:nth-of-type(n + 4) {
                display: none;
            }
        }

        /* Mengikuti pengaturan pengguna yang mengurangi animasi. */
        @media (prefers-reduced-motion: reduce) {
            .maple-fall {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Efek daun mapel jatuh di belakang kartu. -->
    <div class="maple-fall" aria-hidden="true" inert>
        <svg
            class="maple-definitions"
            xmlns="http://www.w3.org/2000/svg"
            focusable="false"
        >
            <defs>
                <symbol id="maple-leaf-shape" viewBox="0 0 64 64">
                    <path d="M31 62 32 47 20 50 22 42 8 36 12 32 4 20 17 23 19 14 26 24 24 10 30 13 33 2 38 13 44 10 41 26 49 16 51 25 62 23 55 35 59 39 44 44 46 52 34 47 34 62Z"/>
                </symbol>
            </defs>
        </svg>

        <span
            class="maple-leaf"
            style="--x: 8%; --size: 18px; --duration: 26s; --delay: -6s; --sway: 22px; --drift: -12px; --leaf-color: #b96b40;"
        >
            <svg viewBox="0 0 64 64" focusable="false">
                <use href="#maple-leaf-shape"/>
            </svg>
        </span>

        <span
            class="maple-leaf"
            style="--x: 49%; --size: 15px; --duration: 31s; --delay: -23s; --sway: -26px; --drift: 12px; --leaf-color: #ad6844;"
        >
            <svg viewBox="0 0 64 64" focusable="false">
                <use href="#maple-leaf-shape"/>
            </svg>
        </span>

        <span
            class="maple-leaf"
            style="--x: 88%; --size: 20px; --duration: 28s; --delay: -14s; --sway: -18px; --drift: -8px; --leaf-color: #c08046;"
        >
            <svg viewBox="0 0 64 64" focusable="false">
                <use href="#maple-leaf-shape"/>
            </svg>
        </span>

        <span
            class="maple-leaf"
            style="--x: 28%; --size: 16px; --duration: 34s; --delay: -9s; --sway: 28px; --drift: 6px; --leaf-color: #b8784d;"
        >
            <svg viewBox="0 0 64 64" focusable="false">
                <use href="#maple-leaf-shape"/>
            </svg>
        </span>

        <span
            class="maple-leaf"
            style="--x: 73%; --size: 19px; --duration: 30s; --delay: -27s; --sway: -22px; --drift: 8px; --leaf-color: #ad6546;"
        >
            <svg viewBox="0 0 64 64" focusable="false">
                <use href="#maple-leaf-shape"/>
            </svg>
        </span>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Ambil data Google Spreadsheet melalui Google Apps Script.
            fetch('https://script.google.com/macros/s/AKfycbwkkVz4PeJoaIthe2SV04I3V7jXYSil74lHsEYH_7B_5ItBc9s6qhyGzjT1FsTbuSgD/exec?action=json')
                .then(response => response.json())
                .then(data => {
                    renderCards(data);
                })
                .catch(err => {
                    renderError(err);
                });
        });

        function renderCards(response) {
            document.getElementById('loading').style.display = 'none';

            var now = new Date();

            var optionsDate = {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            };

            var optionsTime = {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            };

            var dateStr = now.toLocaleDateString('id-ID', optionsDate);
            var timeStr = now.toLocaleTimeString('id-ID', optionsTime) + ' WIB';

            document.getElementById('updateInfo').innerHTML =
                'Update: ' + dateStr + ', ' + timeStr +
                ' <span class="author-tag">| © zkhrf</span>';

            var rows = response;
            var gridContainer = document.getElementById('cardGrid');

            if (!rows || rows.length === 0) {
                gridContainer.innerHTML =
                    '<p style="text-align: left; width: 100%; color: #0f172a; font-weight:600;">Tidak ada data ditemukan.</p>';
                return;
            }

            let kelasMap = {};
            let currentMapelType = '';
            let headersDien = [];
            let headersUmum = [];

            for (var i = 0; i < rows.length; i++) {
                var row = rows[i];

                if (!row || row.length === 0) continue;

                var col0 = row[0] ? row[0].toString().trim() : '';

                if (col0.toLowerCase() === 'no' || col0 === 'No.') {
                    let hasTauhid = row.includes('Tauhid');

                    if (hasTauhid) {
                        currentMapelType = 'DIEN';
                        headersDien = row;
                    } else {
                        currentMapelType = 'UMUM';
                        headersUmum = row;
                    }

                    continue;
                }

                var kelasVal = row[2] ? row[2].toString().trim() : '';

                if (
                    !kelasVal ||
                    !kelasVal.toLowerCase().startsWith('kelas')
                ) {
                    continue;
                }

                if (!kelasMap[kelasVal]) {
                    kelasMap[kelasVal] = {
                        dienRow: null,
                        umumRow: null,
                        dienHeaders: [],
                        umumHeaders: []
                    };
                }

                if (currentMapelType === 'DIEN') {
                    kelasMap[kelasVal].dienRow = row;
                    kelasMap[kelasVal].dienHeaders = headersDien;
                } else if (currentMapelType === 'UMUM') {
                    kelasMap[kelasVal].umumRow = row;
                    kelasMap[kelasVal].umumHeaders = headersUmum;
                }
            }

            var html = '';

            for (var kelas in kelasMap) {
                html += '<div class="card">';

                html += '<div class="card-header">';
                html += '<div class="card-title">' + kelas + '</div>';
                html += '</div>';

                html += '<div class="sections-wrapper">';

                // DIEN
                html += '<div class="section-box">';
                html += '<div class="section-title title-dien">📚 Mapel DIEN</div>';

                var dienData = kelasMap[kelas].dienRow;
                var dienHeaders = kelasMap[kelas].dienHeaders;

                if (dienData && dienHeaders.length > 0) {
                    for (var j = 3; j < dienHeaders.length; j++) {
                        var labelName = dienHeaders[j]
                            ? dienHeaders[j].toString().trim()
                            : '';

                        if (!labelName) continue;

                        var valueText =
                            (dienData[j] !== undefined && dienData[j] !== null)
                                ? dienData[j].toString().trim()
                                : 'Belum';

                        html += buildItemHtml(labelName, valueText);
                    }
                } else {
                    html += '<p style="font-size:10px; color:#64748b; font-style:italic;">Belum ada.</p>';
                }

                html += '</div>';

                // UMUM
                html += '<div class="section-box">';
                html += '<div class="section-title title-umum">📖 Mapel UMUM</div>';

                var umumData = kelasMap[kelas].umumRow;
                var umumHeaders = kelasMap[kelas].umumHeaders;

                if (umumData && umumHeaders.length > 0) {
                    for (var k = 3; k < umumHeaders.length; k++) {
                        var labelNameUmum = umumHeaders[k]
                            ? umumHeaders[k].toString().trim()
                            : '';

                        if (!labelNameUmum) continue;

                        var valueTextUmum =
                            (umumData[k] !== undefined && umumData[k] !== null)
                                ? umumData[k].toString().trim()
                                : 'Belum';

                        html += buildItemHtml(labelNameUmum, valueTextUmum);
                    }
                } else {
                    html += '<p style="font-size:10px; color:#64748b; font-style:italic;">Belum ada.</p>';
                }

                html += '</div>';
                html += '</div>';
                html += '</div>';
            }

            gridContainer.innerHTML = html !== ''
                ? html
                : '<p style="text-align: left; width: 100%; color: #0f172a; font-weight:600;">Tidak ada data valid.</p>';
        }

        function buildItemHtml(label, value) {
            var pillClass = 'status-abu';
            var valLower = String(value).toLowerCase();

            if (valLower.includes('belum')) {
                pillClass = 'status-merah';
            } else if (
                valLower.includes('tidak ada mapel') ||
                valLower === ''
            ) {
                pillClass = 'status-abu';
                value = 'Tidak Ada Mapel';
            } else if (valLower.includes('sudah')) {
                pillClass = 'status-hijau';
            } else {
                pillClass = 'status-hijau';
            }

            var itemHtml = '<div class="card-item">';

            itemHtml +=
                '<span class="label" title="' + label + '">' +
                label +
                '</span>';

            itemHtml +=
                '<span class="status-pill ' + pillClass + '">' +
                value +
                '</span>';

            itemHtml += '</div>';

            return itemHtml;
        }

        function renderError(err) {
            document.getElementById('loading').innerHTML =
                '<span style="color: #b91c1c; font-weight:600;">Gagal memuat data: ' +
                err.message +
                '</span>';
        }
    </script>

    <div class="container">

        <!-- Surat di atas, mengikuti alur halaman biasa. -->
        <div class="announcement-card">
            <img
                src="1.1. SURAT PEMBERITAHUAN PEMBUATAN SOAL_1.png"
                alt="Surat Pemberitahuan ASAS DEC-26"
            >
        </div>

        <!-- Checklist dengan kartu kaca di bawah surat. -->
        <div class="checklist-panel">
            <div class="header-section">
                <h2>Checklist Pengumpulan Soal ASAS DEC-26</h2>

                <div id="updateInfo" class="update-info">
                    <span>Update: Updating...</span>
                    <span class="author-tag">| © zkhrf</span>
                </div>
            </div>

            <div id="loading" class="loading">Sabar bang...</div>
            <div id="cardGrid" class="card-grid"></div>
        </div>

    </div>

</body>
</html>
