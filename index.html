<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Progress Soal ASAS Ganjil 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #f0f7fc 0%, #e1f0fa 50%, #d3e7f5 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .iframe-container {
            width: 100%;
            height: 100vh;
            border: none;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Indikator loading ringan di GitHub Pages jika server Google sedang inisialisasi */
        .page-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #64748b;
            font-size: 14px;
            font-style: italic;
            z-index: -1;
        }
    </style>
</head>
<body>

<div class="iframe-container">
    <div class="page-loader">Sabar bang messi...</div>
    <!-- loading="lazy" dihapus agar browser langsung memuat tanpa jeda -->
    <iframe src="https://script.google.com/macros/s/AKfycbxrKQDuCOME8L9bmFLpOdZyFA2wBYqhfmkUN4oqlXnI5df3bdLxamEEXsmO-wniDKiT/exec" 
            allow="fullscreen">
    </iframe>
</div>

</body>
</html>
