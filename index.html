<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Progress Soal ASAS Ganjil 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            min-height: 100vh;
            height: auto;
            overflow-y: auto; 
            /* Background disesuaikan menjadi nuansa abu-abu modern dengan aksen gradien biru elegan */
            background: radial-gradient(circle at center, #cbd5e1 0%, #94a3b8 50%, #64748b 100%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .iframe-container {
            width: 100%;
            min-height: 100vh;
            height: auto;
            border: none;
            position: relative;
        }
        iframe {
            width: 100%;
            min-height: 100vh;
            height: 100%;
            border: none;
            display: block;
        }
        .page-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f8fafc;
            font-size: 14px;
            font-style: italic;
            z-index: -1;
        }
    </style>
</head>
<body>

<div class="iframe-container">
    <div class="page-loader">Menghubungkan ke server...</div>
    <iframe src="https://script.google.com/macros/s/AKfycby3_ubiNyLnJ75s5_OMwBLaPbbXA9l78FUgAMX0owjpLdNu4O0S4vvLCT5OM_ONeZLW/exec" 
            allow="fullscreen">
    </iframe>
</div>

</body>
</html>
