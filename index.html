<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Checklist Pengumpulan Soal ASAS DEC-26</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: radial-gradient(circle at center, #d8e6fc 0%, #e5eff8 50%, #eef3f9 100%);
            background-attachment: fixed;
            margin: 0; 
            padding: 15px 12px 60px 12px; 
            color: #0f172a; 
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Lapisan Kontainer Daun Maple di Latar Belakang */
        #leaf-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 0;          
            overflow: hidden;
        }

        .maple-leaf {
            position: absolute;
            width: 20px;
            height: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23d97706"><path d="M12 2l1.5 3.5L17 4l-1 4 3 2-3.5 1.5L16 16l-4-2-4 2 1.5-4.5L6 10l3-2-1-4 3.5 1.5L12 2z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.75;
            animation: fallAndSway linear infinite;
            will-change: transform;
        }

        @keyframes fallAndSway {
            0% { transform: translateY(-30px) translateX(0deg) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            50% { transform: translateY(50vh) translateX(25px) rotate(180deg); }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(-15px) rotate(360deg); opacity: 0; }
        }
        
        .container { 
            max-width: 950px; 
            width: 100%; 
            margin: 0 auto; 
            position: relative;
            z-index: 2; 
        }

        /* Gaya Kartu Gambar Pengumuman / Surat Pemberitahuan */
        .announcement-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 
                        inset 0 1px 1px 0 rgba(255, 255, 255, 0.9), 
                        inset 0 -1px 2px 0 rgba(148, 163, 184, 0.2);
            padding: 10px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            width: 100%;
        }

        .announcement-card img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }
