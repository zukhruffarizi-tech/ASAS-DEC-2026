<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Checklist Pengumpulan Soal ASAS DEC-26</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            min-height: 100vh;
            height: auto;
            overflow-y: auto; 
            /* Latar belakang persis gaya Gemini: Biru lembut di tengah, memudar elegan ke abu-abu terang di tepi */
            background: radial-gradient(circle at center, #d8e6fc 0%, #e5eff8 50%, #eef3f9 100%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .iframe-container {
            width: 100%;
            min-height: 100vh;
            height: auto;
            border: none;
            position: relative;
        }
        iframe {
            width: 100%;
            min-height: 100vh;
            height: 100%;
            border: none;
            display: block;
        }
        .page-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #475569;
            font-size: 14px;
            font-style: italic;
            z-index: -1;
        }
    </style>
</head>
<body>

<div class="iframe-container">
    <div class="page-loader">Menghubungkan ke server...</div>
    <iframe src="https://script.google.com/macros/s/AKfycbxmnX1hT9kb-Y2mxaCzkg92V56mAK94dlKs283M3n_DxtoR9_arsEu_H9igpi0CDt1F/exec" 
            allow="fullscreen">
    </iframe>
</div>

</body>
</html>
